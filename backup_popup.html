<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backup</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .card {
    background: beige;
    border-radius: 16px;
    width: 380px;
    overflow: hidden;
    border: 0.5px solid rgba(0,0,0,0.12);
    box-shadow: 0 8px 32px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.1);
  }

  .header {
    background: #000;
    padding: 32px;
    text-align: center;
  }

  .icon-circle {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
  }

  .header h1 {
    color: #fff;
    font-size: 18px;
    font-weight: 800;
    margin: 0 0 6px;
    text-transform:uppercase;
  }

  .header p {
    color: rgba(255,255,255,0.65);
    font-size: 14px;
    line-height: 1.6;
  }

  .body {
    padding: 20px 24px 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #ffead7;
  }

  /* .info-badge {
    background: #f5f5f5;
    border: 0.5px solid rgba(0,0,0,0.1);
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .info-badge span {
    font-size: 12px;
    color: #666;
    line-height: 1.4;
  } */

  .btn {
    width: 100%;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: opacity 0.15s, transform 0.1s;
    border: none;
  }

  .btn:active { transform: scale(0.98); }

  .btn-primary {
    padding: 11px;
    background: #000;
    color: #fff;
    font-weight: bold;
  }

  .btn-primary:hover { background: #000; }

  .btn-secondary {
    padding: 11px;
    background: #ccc;
    color: #1a1a1a;
    border: 0.5px solid rgba(0,0,0,0.15) !important;
    font-weight: bold;
  }

  .btn-secondary:hover { background: #fff; }

  .btn-ghost {
    padding: 8px;
    background: transparent;
    color: #999;
    font-size: 12px;
    font-weight: bold;
  }

  .btn-ghost:hover { color: #555; }

  /* Loading state */
  .btn-primary.loading {
    pointer-events: none;
    opacity: 0.75;
  }

  .spinner {
    display: none;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }

  .btn-primary.loading .spinner { display: block; }
  .btn-primary.loading .btn-icon { display: none; }
  .btn-primary.loading .btn-label::after { content: 'Saving…'; }
  .btn-primary.loading .btn-label { font-size: 0; }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="icon-circle">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
        <polyline points="17 21 17 13 7 13 7 21"/>
        <polyline points="7 3 7 8 15 8"/>
      </svg>
    </div>
    <h1>Backup before closing?</h1>
    <p>Your sales, inventory and customer records<br>will be saved to C:\POS_Backups\</p>
  </div>

  <div class="body">
    <!-- <div class="info-badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#e63000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span>Includes SQLite file + Excel report with all data</span>
    </div> -->

    <button class="btn btn-primary" id="btn-backup" onclick="choose(0)">
      <span class="spinner"></span>
      <svg class="btn-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
        <polyline points="17 21 17 13 7 13 7 21"/>
        <polyline points="7 3 7 8 15 8"/>
      </svg>
      <span class="btn-label">Yes, backup &amp; close</span>
    </button>

    <button class="btn btn-secondary" onclick="choose(1)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      No, just close
    </button>

    <button class="btn btn-ghost" onclick="choose(2)">&#x2715;&nbsp; Cancel</button>
  </div>
</div>

<script>
  function choose(response) {
    if (response === 0) {
      // Show loading spinner while backup runs
      const btn = document.getElementById('btn-backup');
      btn.classList.add('loading');
      document.querySelectorAll('.btn').forEach(b => b.disabled = true);
    }
    // ipcRenderer is injected via nodeIntegration: true on this window
    require('electron').ipcRenderer.send('backup-popup-response', response);
  }
</script>

</body>
</html>
